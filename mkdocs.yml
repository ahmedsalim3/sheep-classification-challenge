site_name: Sheep Classification Challenge
site_description: A deep learning solution for classifying sheep breeds with semi-supervised learning.
site_author: Ahmed Hashem Tahassalim
site_url: https://ahmedsalim3.github.io/sheep-classification-challenge/

theme:
  name: material
  logo: assets/images/logo.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: teal
      accent: teal
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  favicon: assets/images/favicon.png

nav:
  - Home: index.md
  - Solution: solution.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - footnotes
  - def_list

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ahmedsalim3
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/ahmedsalim3
    - icon: fontawesome/solid/globe
      link: https://ahmedsalim3.github.io/
